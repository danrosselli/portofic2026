      <stop offset="0" stop-color="#2b2118"/><stop offset="1" stop-color="#17120d"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .18 0 0 0 0 .13 0 0 0 0 .08 0 0 0 .5 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#bg)" filter="url(#rough)" opacity=".4"/>

