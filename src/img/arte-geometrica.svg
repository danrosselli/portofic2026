      <circle r="34"/>
      <path d="M0-44v-14M0 44v14M-44 0h-14M44 0h14"/>
    </g>
  </g>
  <g fill="#b0512a" opacity=".6">
    <circle cx="680" cy="860" r="7"/><circle cx="700" cy="830" r="5"/><circle cx="660" cy="830" r="4"/>
    <circle cx="120" cy="180" r="8"/><circle cx="150" cy="160" r="5"/><circle cx="132" cy="210" r="5"/>
