<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191411"/>
      <stop offset=".55" stop-color="#221a13"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c221a"/>
      <stop offset=".5" stop-color="#241b13"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <path d="M-40 0H1600V760Q1500 720 1380 700 1260 680 1180 640 1040 578 930 560 820 542 700 520 560 496 430 460 300 420 180 380 60 340-40 300V0z" fill="#17120d"/>

  <!-- paredão -->
  <g>
    <path d="M520 1000V560Q640 500 780 470 960 430 1120 460 1290 492 1420 600 1520 668 1600 700V1000z" fill="url(#wall)"/>
    <path d="M760 470Q940 400 1120 460 1240 490 1380 560L1380 620Q1260 550 1140 520 1000 484 860 510 780 522 720 556z" fill="#2e241a"/>
    <path d="M900 460Q1080 380 1280 470 1380 516 1480 570V640Q1360 570 1240 520 1080 450 940 500z" fill="#33281e"/>
    <path d="M1040 440Q1200 370 1360 460 1440 500 1520 560V640Q1400 570 1280 520 1160 470 1080 490z" fill="#3a2d21"/>
    <!-- estratos -->
    <g fill="none" stroke="#4a3a2a" stroke-width="3" opacity=".5">
      <path d="M520 1000q120-34 240 0t240 0 240 0 240 0 120 0"/>
      <path d="M640 820q120-30 240 0t240 0 240 0 240 0"/>
      <path d="M760 660q120-26 240 0t240 0 240 0 120 0"/>
    </g>
    <!-- relevo do paredão -->
    <path d="M520 1000V600Q560 560 600 590T680 620T760 590T840 630T920 590T1000 640T1080 600T1160 640T1240 610T1320 660T1400 630T1480 690V1000z" fill="none" stroke="#0f0b08" stroke-width="2" opacity=".4"/>
  </g>

  <!-- motivos rupestres -->
  <g stroke="#b0512a" stroke-width="6" stroke-linecap="round" fill="none" opacity=".82">
    <!-- mão -->
    <g transform="translate(940 560) scale(1.15)">
      <ellipse cx="0" cy="6" rx="13" ry="15" stroke-width="5" fill="#b0512a"/>
      <path d="M-9-2v-20M-4-1v-24M2-1v-26M8-1v-23M13-2v-19"/>
    </g>
    <!-- cervídeo -->
    <g transform="translate(1180 540)">
      <path d="M0 40l4-26 3 8 4-12 1 14 8-6-3 8 9-3-4 8 10 1-6 8 2 4"/>
      <path d="M-2 44q14 2 24 0" stroke-width="4"/>
    </g>
    <!-- espiral / círculos -->
    <g transform="translate(1060 640)" stroke-width="4" opacity=".9">
      <circle r="16"/><circle r="10" stroke-dasharray="2 6"/>
    </g>
    <!-- figuras humanas -->
    <g transform="translate(1320 620)" stroke-width="5">
      <path d="M0 0q-2 6 0 10 3-4 0-10zM-7 16l7-6 7 6-3 22-8-2z"/>
      <path d="M-8 30l-10 8M8 30l10 8"/>
    </g>
    <path d="M560 640l12-34 12 34 12-34 12 34"/>
